<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signix Digital | Tasks</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#0b1220;color:#eaf0f8}
*{box-sizing:border-box}
body{margin:0}
header{padding:16px 20px;border-bottom:1px solid #29354a;display:flex;justify-content:space-between;align-items:center;gap:12px}
.header-actions{display:flex;align-items:center;gap:10px}
h1{font-size:21px;margin:0}
main{max-width:1500px;margin:auto;padding:18px}
.panel{background:#121e30;border:1px solid #2c3c54;border-radius:16px;padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid #35445d;border-radius:10px;background:#1c2b42;color:white;padding:11px 14px}
.primary{background:#3975db}
button:disabled{opacity:.65;cursor:wait}
input,select,textarea{width:100%;background:#0b1525;color:white;border:1px solid #40516b;border-radius:9px;padding:12px;margin:6px 0 12px}
label{display:block;color:#cbd5e1;font-size:14px}
.hidden{display:none!important}
.muted{color:#aab8cd}
.task{border-top:1px solid #29384f;padding:14px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
a{color:#9fc2ff}
#auth{max-width:520px;margin:12px auto}
nav{display:flex;gap:8px;margin:6px 0 4px}
nav button[aria-pressed="true"]{border-color:#90baff}
textarea{min-height:75px}
.password-wrap{position:relative}
.password-wrap input{padding-right:70px}
.toggle-password{position:absolute;right:6px;top:10px;padding:7px 10px;font-size:13px;background:transparent;border:0;color:#cbd5e1}
.link-button{background:transparent;border:0;color:#9fc2ff;padding:6px 0;text-decoration:underline}
#message:not(:empty){padding:10px 0;white-space:pre-wrap;margin:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #90baff;outline-offset:2px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:20px;background:#26364d;border:1px solid transparent;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap;color:#e2e8f0}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 8px}
.badge.pr-high{color:#ff8a8a;background:rgba(255,40,40,.2);border-color:rgba(255,40,40,.75)}
.badge.pr-medium{color:#fde047;background:rgba(234,179,8,.14);border-color:rgba(234,179,8,.5)}
.badge.pr-low{color:#7dd3fc;background:rgba(14,165,233,.14);border-color:rgba(14,165,233,.5)}
.badge.st-incoming{color:#d8b4fe;background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.5)}
.badge.st-to-do{color:#e2e8f0;background:rgba(148,163,184,.16);border-color:rgba(148,163,184,.45)}
.badge.st-in-progress{color:#a5b4fc;background:rgba(99,102,241,.2);border-color:rgba(99,102,241,.55)}
.badge.st-waiting-on-client{color:#fdba74;background:rgba(249,115,22,.15);border-color:rgba(249,115,22,.5)}
.badge.st-completed{color:#86efac;background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5)}
.due-chip{display:inline-flex;align-items:center;font-size:12px;color:#cbd5e1;border:1px dashed #40516b;border-radius:20px;padding:4px 10px;background:transparent;white-space:nowrap}
.due-chip.due-overdue{color:#fecaca;border:1px solid rgba(239,68,68,.6);background:rgba(239,68,68,.15);font-weight:600}
.due-chip.due-today{color:#fde68a;border-style:solid;border-color:rgba(234,179,8,.55)}
button.tap{font-size:12px;min-height:30px;padding:4px 10px;border-radius:20px}
button.tap::after{content:"▾";font-size:10px;opacity:.75;margin-left:2px}
button.tap:hover{filter:brightness(1.2)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{text-align:left;background:#121e30;border:1px solid #2c3c54;border-radius:14px;padding:14px;color:#aab8cd;font-size:13px}
.stat strong{display:block;font-size:28px;color:#fff;margin-top:4px;line-height:1.1}
.stat:hover{border-color:#90baff}
.stat.incoming strong{color:#d8b4fe}
.stat.alert strong{color:#fca5a5}
.stat.today strong{color:#fde68a}

/* Toolbar */
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head h2{margin:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:12px 0 14px}
.tool{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.tool-label{font-size:11px;color:#9fb0c7;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;border-radius:20px;font-size:13px;background:#16233a}
.chip[aria-pressed="true"]{background:#3975db;border-color:#3975db}
.toolbar select{width:auto;max-width:220px;margin:0;padding:8px 10px}

/* Board + groups */
.groups{display:flex;flex-direction:column;gap:14px}
.group{background:#0e1828;border:1px solid #233149;border-radius:14px;padding:10px;min-width:0;transition:outline-color .3s}
.group.flash{outline:2px solid #90baff;outline-offset:2px}
.group-head{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.group-head h3{margin:0;font-size:15px}
.count{margin-left:auto;background:#1c2b42;border-radius:20px;padding:2px 9px;font-size:12px;color:#cbd5e1}
.gdot{width:10px;height:10px;border-radius:50%;background:#64748b;flex:0 0 10px}
.group.st-incoming .gdot{background:#a855f7}
.group.st-to-do .gdot{background:#94a3b8}
.group.st-in-progress .gdot{background:#6366f1}
.group.st-waiting-on-client .gdot{background:#f97316}
.group.st-completed .gdot{background:#22c55e}
.group.pr-high .gdot,.group.bucket-overdue .gdot{background:#ff2828}
.group.bucket-today .gdot{background:#eab308}
.group.bucket-tomorrow .gdot{background:#0ea5e9}
.group.bucket-week .gdot{background:#6366f1}
.group.bucket-later .gdot{background:#94a3b8}
.group.bucket-overdue .group-head h3{color:#fca5a5}
.group.st-in-progress{background:linear-gradient(180deg,rgba(99,102,241,.2),#0e1828 55%);border:1px solid rgba(129,140,248,.7);box-shadow:0 0 0 1px rgba(99,102,241,.25),0 0 26px rgba(99,102,241,.22)}
.group.st-in-progress .group-head h3{color:#c7d2fe;text-shadow:0 0 12px rgba(129,140,248,.6)}
.group.st-in-progress .gdot{animation:ip-dot calc(3.6s*var(--spd,1)) ease-in-out infinite}
.group.st-in-progress .count{background:#3730a3;color:#e0e7ff}
@keyframes ip-dot{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,.7)}50%{box-shadow:0 0 0 6px rgba(99,102,241,0)}}
.group-body{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.empty-col{margin:4px;font-size:14px}
.empty{padding:16px 4px}
.layout-compact .group-body{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.layout-list .group-body{grid-template-columns:1fr;gap:6px}
.layout-board .group-body{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
@media (orientation:landscape) and (min-width:900px){
 .layout-board .groups{flex-direction:row;overflow-x:auto;align-items:flex-start;padding-bottom:8px;scroll-snap-type:x proximity}
 .layout-board .group{flex:1 1 0;min-width:270px;scroll-snap-align:start}
 .layout-board .group-body{grid-template-columns:1fr;max-height:72vh;overflow-y:auto;padding-right:2px}
 .tasks-only .layout-board .group-body{max-height:calc(100vh - var(--board-top,200px) - 70px)}
}

/* Task cards */
.tcard{background:#121e30;border:1px solid #2c3c54;border-left:11px solid #64748b;border-radius:12px;padding:12px 12px 12px 13px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.tcard.pr-high{border-left-color:#ff2828}
.tcard.pr-high:not(.st-completed){animation:high-pulse calc(4.2s*var(--spd,1)) ease-in-out infinite}
@keyframes high-pulse{0%,100%{border-left-color:#ff2828;box-shadow:-2px 0 0 rgba(255,40,40,0)}50%{border-left-color:#ff6b6b;box-shadow:-6px 0 16px rgba(255,40,40,.6)}}
.tcard.pr-medium{border-left-color:#eab308}
.tcard.pr-low{border-left-color:#0ea5e9}
.tcard.st-completed{opacity:.8}
.tc-biz{display:flex;align-items:center;gap:10px;margin:-12px -12px 2px -13px;padding:8px 12px 8px 12px;background:var(--biz-bg,#1a2840);border-bottom:2px solid var(--biz,#3a4b66);min-width:0}
.tc-biz .biz-name{font-size:12px;color:#e2e8f0;font-weight:600;opacity:.9;overflow-wrap:anywhere;min-width:0}
.logo-circle.card{flex:0 0 38px;width:38px;height:38px;font-size:14px;border-width:2px}
.layout-compact .tc-biz{padding:6px 10px;margin:-9px -10px 0 -12px}
.layout-compact .tcard,.layout-list .tcard{border-left-width:9px}
.layout-compact .logo-circle.card{flex-basis:30px;width:30px;height:30px;font-size:12px}
.layout-list .tc-biz{margin:0;padding:4px 10px 4px 4px;border-radius:20px;border-bottom:0;flex:0 1 220px}
.layout-list .logo-circle.card{flex-basis:28px;width:28px;height:28px;font-size:11px}
.tc-title{margin:0;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.tc-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tc-by{font-size:13px;color:#cbd5e1;display:flex;align-items:center;gap:6px}
.tc-by strong{color:#fff;font-weight:600}
.tc-by svg{width:14px;height:14px;opacity:.75}
.login-row{border-top:1px solid #29384f;padding:12px 0;display:grid;gap:8px}
.login-row .name-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.login-row .name-form input{flex:1 1 160px;margin:0;padding:9px 10px}
.login-row .name-form button{padding:9px 12px}
.tc-desc{margin:0;color:#d5deea;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.media-toggle{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:6px 12px;border-radius:20px;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.5);color:#bae6fd;min-height:34px}
.media-toggle svg{width:16px;height:16px;flex:0 0 16px}
.media-toggle .hint{opacity:.75;font-size:12px}
.media-toggle[aria-expanded="false"]{animation:media-pulse calc(4.2s*var(--spd,1)) ease-in-out infinite}
.media-toggle[aria-expanded="true"]{background:#1c2b42;border-color:#40516b;color:#cbd5e1}
@keyframes media-pulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.45)}50%{box-shadow:0 0 0 6px rgba(56,189,248,0)}}
.tc-media{flex-basis:100%;min-width:0}
.work-bar{position:relative;height:8px;border-radius:6px;background:rgba(99,102,241,.22);overflow:hidden}
.work-bar::before{content:"";position:absolute;inset:0;border-radius:6px;background-image:linear-gradient(45deg,rgba(165,180,252,.38) 25%,transparent 25%,transparent 50%,rgba(165,180,252,.38) 50%,rgba(165,180,252,.38) 75%,transparent 75%,transparent);background-size:16px 16px;animation:work-drift calc(4s*var(--spd,1)) linear infinite}
@keyframes work-drift{from{background-position:0 0}to{background-position:0 16px}}
/* Animation switches (set from the admin Animations panel) */
body.no-anim-high .tcard.pr-high{animation:none}
body.no-anim-bar .work-bar::before{animation:none}
body.no-anim-col .group.st-in-progress{box-shadow:none}
body.no-anim-col .group.st-in-progress .group-head h3{text-shadow:none}
body.no-anim-col .group.st-in-progress .gdot{animation:none}
body.no-anim-media .media-toggle[aria-expanded="false"]{animation:none}
body.no-anim-req .request-zone:not([open]) .req-icon,body.no-anim-req .pv-request .req-icon{animation:none}
.pv-request .req-icon{animation:req-pulse calc(3.9s*var(--spd,1)) ease-in-out infinite}
.anim-list{display:grid;gap:2px;margin:0 0 12px}
.anim-list .check{margin:0;padding:10px 0;border-top:1px solid #29384f}
.anim-list .check input{width:22px;height:22px}
#animStatus{font-size:13px;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){.tcard.pr-high:not(.st-completed),.group.st-in-progress .gdot{animation:none}.work-bar::before{animation:none}.media-toggle[aria-expanded="false"],.request-zone:not([open]) .req-icon,.pv-request .req-icon{animation:none}}
.layout-list .work-bar{display:none}
.tc-edit{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bdot{width:10px;height:10px;border-radius:3px;flex:0 0 10px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.layout-compact .tcard{padding:9px 10px 9px 12px;gap:6px}
.layout-compact .tc-title{font-size:14px}
.layout-compact .tc-desc,.layout-list .tc-desc{display:none}
.layout-compact .media-toggle .hint,.layout-list .media-toggle .hint{display:none}
.layout-board .tc-desc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.layout-list .tcard{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 10px 8px 10px;border-radius:10px}
.layout-list .tc-title{flex:1 1 200px;font-size:14px}
.edit-form label{margin:0}
.edit-form .row{justify-content:flex-start}

#client .layout-board .tc-title{font-size:17px}
#client .layout-board .tc-desc{display:block;-webkit-line-clamp:unset;overflow:visible}
@media (orientation:landscape) and (min-width:900px){#client .layout-board .group{min-width:300px}}

/* Media */
.media{display:flex;flex-wrap:wrap;gap:10px}
.media a.thumb img{display:block;width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid #2c3c54}
.media video{width:260px;max-width:100%;border-radius:10px;background:#000}
.media .clip{display:flex;flex-direction:column;gap:4px;max-width:100%}
.media audio{width:260px;max-width:100%}
.media small a{color:#9fc2ff}

/* Popover menu */
.menu{position:fixed;z-index:50;background:#16233a;border:1px solid #3a4b66;border-radius:12px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.5);min-width:210px;display:flex;flex-direction:column;gap:4px}
.menu-item{background:transparent;border:0;text-align:left;padding:8px;border-radius:8px;min-height:40px}
.menu-item:hover,.menu-item:focus-visible{background:#22324d}
.menu-item.current{background:#1d2c45;box-shadow:inset 0 0 0 1px #3975db}
.menu-title{font-size:11px;color:#9fb0c7;text-transform:uppercase;letter-spacing:.05em;padding:4px 8px}
.menu-due{padding:4px 6px}
.menu-due .row{justify-content:flex-start}

/* Collapsible panels */
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:18px;font-weight:700}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:22px;color:#9fc2ff}
details.fold[open]>summary::after{content:"–"}
details.fold[open]>summary{margin-bottom:12px}
.admin-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:0 12px;align-items:start}

/* Client portal + branding */
#client{--brand:#3975db;--brand-text:#ffffff;--brand2:#121e30;--brand-soft:rgba(57,117,219,.22);--brand-glow:rgba(57,117,219,.45)}
.request-zone{background:linear-gradient(135deg,var(--brand-soft),#0a1220 75%);border:2px solid var(--brand);box-shadow:0 0 0 4px var(--brand-soft),0 10px 28px rgba(0,0,0,.35);margin:16px 0 20px}
.request-zone>summary{font-size:19px}
.request-zone>summary::after{display:none}
.req-head{display:flex;align-items:center;gap:12px}
.req-icon{flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--brand-text);display:grid;place-items:center;font-size:24px;font-weight:700;line-height:1;transition:transform .2s}
.request-zone[open] .req-icon{transform:rotate(45deg)}
.request-zone:not([open]) .req-icon{animation:req-pulse calc(3.9s*var(--spd,1)) ease-in-out infinite}
@keyframes req-pulse{0%,100%{box-shadow:0 0 0 0 var(--brand-glow)}50%{box-shadow:0 0 0 10px rgba(0,0,0,0)}}
.req-sub{display:block;font-size:13px;font-weight:400;color:#cbd5e1;margin-top:2px}
.request-zone[open] .req-sub{display:none}
#client .primary{background:var(--brand);color:var(--brand-text);border-color:var(--brand)}
#client .chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-text);border-color:var(--brand)}
.portal-hero{border-radius:14px;padding:22px 18px;margin:0 0 12px;background-color:#0b1525;background-image:linear-gradient(135deg,var(--brand2),#0b1525);background-size:cover;background-position:center;border:1px solid #2c3c54;border-top:4px solid var(--brand)}
.portal-hero.has-backdrop{min-height:180px;display:flex;align-items:flex-end}
.hero-inner{display:flex;align-items:center;gap:14px}
.hero-inner h2{margin:0}
.hero-inner p{margin:4px 0 0}
.portal-hero.has-backdrop .muted{color:#e2e8f0}
.logo-circle{flex:0 0 64px;width:64px;height:64px;border-radius:50%;background:var(--brand,#3975db);color:var(--brand-text,#fff);display:grid;place-items:center;font-weight:700;font-size:22px;overflow:hidden;border:2px solid rgba(255,255,255,.85)}
.logo-circle img{width:100%;height:100%;object-fit:cover;background:#fff}
.logo-circle.sm{flex-basis:34px;width:34px;height:34px;font-size:13px;border-width:1px}

/* Manage clients editor */
.client-card{border-top:1px solid #29384f;padding:10px 0}
.client-card summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;padding:4px 0}
.client-card summary::-webkit-details-marker{display:none}
.client-card summary .edit-hint{margin-left:auto;color:#9fc2ff;font-size:14px}
.client-card form{margin-top:12px}
.client-card fieldset{border:1px solid #2c3c54;border-radius:12px;padding:12px;margin:0 0 12px}
.client-card legend{color:#cbd5e1;font-size:14px;padding:0 6px}
.check{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.check input{width:auto;margin:0}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.colors label{flex:1 1 120px}
.colors input[type=color]{height:46px;padding:4px;cursor:pointer}
.brand-preview{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.brand-preview img.backdrop{width:120px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #2c3c54}
.preview-btn{margin:2px 0 12px}
.brand-live{border:1px dashed #40516b;border-radius:12px;padding:12px;margin:0 0 12px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.pv-label{font-size:11px;text-transform:uppercase;color:#9fb0c7;letter-spacing:.05em;margin-bottom:6px}
.pv-card{max-width:360px}
.pv-portal{background:#121e30;border:1px solid #2c3c54;border-radius:14px;padding:10px}
.pv-portal .portal-hero{padding:14px;margin-bottom:10px}
.pv-portal .portal-hero.has-backdrop{min-height:120px}
.pv-portal .hero-inner h2{font-size:17px}
.pv-portal .logo-circle{flex-basis:48px;width:48px;height:48px;font-size:16px}
.pv-request{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:2px solid var(--brand);background:linear-gradient(135deg,var(--brand-soft),#0a1220 75%);box-shadow:0 0 0 3px var(--brand-soft);font-weight:700;font-size:14px}
.pv-request .req-icon{flex-basis:28px;width:28px;height:28px;font-size:18px}

/* Request form attachments */
.attach-row{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.file-button{display:inline-block;border:1px solid #35445d;border-radius:10px;background:#1c2b42;color:white;padding:11px 14px;cursor:pointer;font-size:16px}
.file-button input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.recording{background:#7a2230!important;border-color:#c0475b!important}
.pending{list-style:none;padding:0;margin:0 0 12px}
.pending li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid #29384f;padding:8px 0}
.pending img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.pending audio{width:220px;max-width:100%}
.pending .name{flex:1 1 140px;overflow-wrap:anywhere;font-size:14px}
.pending button{padding:7px 10px;font-size:13px}

/* Pop-out (all tasks only) mode */
.tasks-only main{max-width:none;padding:10px 14px}
.tasks-only header{padding:10px 14px}
.tasks-only #mainNav,.tasks-only #addTaskPanel,.tasks-only .admin-tools,.tasks-only #popOutBtn{display:none!important}
.tasks-only #tasksPanel{margin-top:6px}
