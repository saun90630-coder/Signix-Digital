<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signix Digital | Tasks</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#0b1220;color:#eaf0f8}*{box-sizing:border-box}body{margin:0}header{padding:20px;border-bottom:1px solid #29354a;display:flex;justify-content:space-between}h1{font-size:21px;margin:0}main{max-width:980px;margin:auto;padding:18px}.panel{background:#121e30;border:1px solid #2c3c54;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #35445d;border-radius:10px;background:#1c2b42;color:white;padding:11px 14px}button:disabled{opacity:.6;cursor:wait}.primary{background:#3975db}input,select,textarea{width:100%;background:#0b1525;color:white;border:1px solid #40516b;border-radius:9px;padding:12px;margin:6px 0 12px}label{display:block;color:#cbd5e1;font-size:14px}.hidden{display:none!important}.muted{color:#aab8cd}.task{border-top:1px solid #29384f;padding:14px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.badge{border-radius:20px;background:#26364d;padding:4px 9px;font-size:12px}.high{color:#ffaaa9}.medium{color:#ffda91}.low{color:#9be4c2}nav{display:flex;gap:8px;margin:14px 0}textarea{min-height:75px}.link{background:none;border:0;padding:8px 0;color:#9fc3ff;text-decoration:underline}.auth-actions{margin-top:8px}#message:not(:empty){padding:10px 12px;border:1px solid #40516b;border-radius:9px}
</style></head><body>
<header><div><h1>Signix Digital</h1><small class="muted">Task Management</small></div><button id="logout" class="hidden">Log out</button></header>
<main><p id="message" role="status" aria-live="polite"></p>
<section id="auth" class="panel"><h2 id="authTitle">Sign in</h2>
<form id="loginForm"><label>Email<input type="email" id="email" required autocomplete="email"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button class="primary" type="submit">Sign in</button><div class="auth-actions"><button id="forgot" class="link" type="button">Forgot password?</button></div></form>
<form id="requestForm" class="hidden"><p class="muted">Enter your email and we'll send you a password reset link.</p><label>Email<input type="email" id="resetEmail" required autocomplete="email"></label><button class="primary" type="submit">Send password reset link</button><div><button class="link back" type="button">Back to sign in</button></div></form>
<form id="resetForm" class="hidden"><label>New password<input type="password" id="newPassword" minlength="8" required autocomplete="new-password"></label><button class="primary" type="submit">Set password</button></form>
</section>
<section id="app" class="hidden"><nav><button id="adminBtn">My Dashboard</button><button id="clientBtn">Client Portal</button></nav>
<section id="admin"><div class="grid"><div class="panel"><small>Open tasks</small><h1 id="openCount">0</h1></div><div class="panel"><small>Incoming requests</small><h1 id="requestCount">0</h1></div></div>
<div class="panel"><h2>Add task</h2><form id="taskForm"><label>Task<input name="title" required></label><label>Client<input name="client" required></label><div class="grid"><label>Priority<select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label><label>Due date<input type="date" name="due"></label></div><button class="primary">Add task</button></form></div>
<div class="panel"><h2>All tasks</h2><div id="adminTasks"></div></div></section>
<section id="client" class="hidden"><div class="panel"><h2>Client Portal</h2><p class="muted">Preview only. Client access is disabled until database roles and row-level security are configured.</p><div id="clientTasks"></div></div></section>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
const SUPABASE_URL='https://mhpvdyfrtaazgabmcvtx.supabase.co';
const KEY='sb_publishable_RljzO2G_ltUBbgnjWKF4gA_t-xHrkeI';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
const $=id=>document.getElementById(id);
const show=(id,on)=>$(id).classList.toggle('hidden',!on);
const notice=s=>{$('message').textContent=s};
let currentUser=null,tasks=[],recovering=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function authMode(mode){recovering=mode==='reset';show('auth',true);show('app',false);show('logout',false);for(const id of ['loginForm','requestForm','resetForm'])show(id,id===(mode==='request'?'requestForm':mode==='reset'?'resetForm':'loginForm'));$('authTitle').textContent=mode==='request'?'Reset your password':mode==='reset'?'Set your password':'Sign in';}
async function busy(form,label,work){const button=form.querySelector('button[type=submit]'),old=button.textContent;button.disabled=true;button.textContent=label;try{await work()}catch(e){notice(e.message||'Something went wrong. Please try again.')}finally{button.disabled=false;button.textContent=old}}
function view(which){show('admin',which==='admin');show('client',which==='client')}
$('adminBtn').onclick=()=>view('admin');$('clientBtn').onclick=()=>view('client');
$('logout').onclick=async()=>{const {error}=await sb.auth.signOut();if(error)notice(error.message);else{authMode('login');notice('Signed out.')}};
$('forgot').onclick=()=>{$('resetEmail').value=$('email').value.trim();notice('');authMode('request')};
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>{notice('');authMode('login')});
$('loginForm').onsubmit=async e=>{e.preventDefault();await busy(e.currentTarget,'Signing in…',async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){notice(error.message);return}notice('Signed in');await refresh()})};
$('requestForm').onsubmit=async e=>{e.preventDefault();await busy(e.currentTarget,'Sending…',async()=>{const {error}=await sb.auth.resetPasswordForEmail($('resetEmail').value.trim(),{redirectTo:location.origin+location.pathname});notice(error?(error.status===429?'Too many requests. Please wait before trying again.':error.message):'If the email is registered, a password reset link will arrive shortly. Check your inbox and spam folder.')})};
$('resetForm').onsubmit=async e=>{e.preventDefault();await busy(e.currentTarget,'Updating password…',async()=>{const {error}=await sb.auth.updateUser({password:$('newPassword').value});if(error){notice(error.message);return}await sb.auth.signOut();history.replaceState({},'',location.pathname);authMode('login');notice('Password updated. Sign in with your new password.')})};
function resetMode(){authMode('reset');notice('Enter a new password with at least 8 characters.')}
function card(t){return `<div class="task"><div class="row"><strong>${esc(t.title)}</strong><span class="badge ${esc((t.priority||'medium').toLowerCase())}">${esc(t.priority||'Medium')}</span></div><p class="muted">Client ID: ${esc(t.client_id??'Unassigned')} · ${esc(t.status||'To do')}${t.due_date?' · Due '+esc(t.due_date):''}</p><label>Status<select data-task="${esc(t.id)}">${['Incoming','To do','In progress','Waiting on client','Completed'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></label></div>`}
function render(){$('openCount').textContent=tasks.filter(t=>t.status!=='Completed').length;$('requestCount').textContent=tasks.filter(t=>t.status==='Incoming').length;$('adminTasks').innerHTML=tasks.length?tasks.map(card).join(''):'No tasks yet.';$('clientTasks').textContent='Client accounts are not enabled yet.'}
async function loadTasks(){const {data,error}=await sb.from('tasks').select('id,title,status,priority,due_date,client_id').order('id',{ascending:false});if(error){notice('Database access: '+error.message+'. Check table columns and RLS policies.');return}tasks=data||[];render()}
async function refresh(){const {data:{user},error}=await sb.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')notice(error.message);currentUser=user;if(recovering)return;show('auth',!user);show('app',!!user);show('logout',!!user);if(user){view('admin');await loadTasks()}else authMode('login')}
$('taskForm').onsubmit=async e=>{e.preventDefault();notice('Task creation is paused until client names are mapped to database client IDs and admin-only permissions are configured. No task was saved.')};
$('adminTasks').addEventListener('change',async e=>{const id=e.target.dataset.task;if(!id)return;const {error}=await sb.from('tasks').update({status:e.target.value}).eq('id',id);if(error)notice(error.message);else await loadTasks()});
sb.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY')resetMode();else if(event==='SIGNED_OUT'&&!recovering){show('app',false);show('auth',true);show('logout',false)}});
(async()=>{const params=new URLSearchParams(location.search);if(params.has('error'))notice(params.get('error_description')||'Authentication link failed. Request another reset email.');const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('type')==='recovery'&&hash.has('access_token')&&hash.has('refresh_token')){const {error}=await sb.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(error)notice(error.message);else resetMode()}else await refresh()})();
</script></body></html>'''
